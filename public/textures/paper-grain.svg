<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <title>Synapse paper grain (decorative texture)</title>
  <filter id="paper-grain">
    <!-- fractalNoise = organic Perlin variation (paper fibers), not a mechanical pattern.
         Anisotropic baseFrequency gives a subtle directional fiber; low octaves keep it restrained;
         stitchTiles makes the 200px tile seamless. Desaturated to neutral grey so CSS controls
         intensity/blend/tint per surface and per theme. -->
    <feTurbulence type="fractalNoise" baseFrequency="0.82 0.6" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" in="noise" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#paper-grain)"/>
</svg>
